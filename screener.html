<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index Screener | Jypark13 Investment Dashboard</title>
    <meta name="description" content="S&P 500, Nasdaq-100, Dow Jones 인덱스 구성종목을 검색·필터링·비교하는 스크리닝 도구입니다.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at 50% 50%, #1a1b26 0%, #0f1017 100%);
            --card-bg: rgba(26, 27, 38, 0.6);
            --card-border: rgba(130, 140, 180, 0.1);
            --text-primary: #e1e4ed;
            --text-secondary: #8b92a8;
            --accent-glow: 0 15px 35px -10px rgba(130, 140, 200, 0.08);
            --font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --accent: #7c8cf5;
            --accent-dim: rgba(124, 140, 245, 0.15);
            --sp500-color: #38bdf8;
            --ndx-color: #a78bfa;
            --dow-color: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            background: var(--bg-gradient);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 0 20px 40px;
            line-height: 1.6;
            position: relative;
            overflow-x: hidden;
        }

        /* Ambient glowing backgrounds */
        .bg-glow-1 {
            position: fixed;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(100, 110, 180, 0.06) 0%, rgba(100, 110, 180, 0) 70%);
            top: -10%;
            left: -10%;
            z-index: 0;
            pointer-events: none;
        }

        .bg-glow-2 {
            position: fixed;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(90, 100, 170, 0.05) 0%, rgba(90, 100, 170, 0) 70%);
            bottom: -10%;
            right: -10%;
            z-index: 0;
            pointer-events: none;
        }

        /* ─── Navigation Bar ─── */
        .nav-tabs {
            display: flex;
            gap: 4px;
            background: rgba(26, 27, 38, 0.5);
            padding: 4px;
            border-radius: 12px;
            border: 1px solid rgba(130, 140, 180, 0.1);
        }

        .nav-tab {
            padding: 8px 20px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
            text-decoration: none;
            transition: all 0.2s ease;
            position: relative;
        }

        .nav-tab:hover {
            color: var(--text-primary);
            background: rgba(124, 140, 245, 0.08);
        }

        .nav-tab.active {
            color: var(--accent);
            background: var(--accent-dim);
            font-weight: 600;
        }

        /* ─── Container ─── */
        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* ─── Page Header ─── */
        .page-header {
            padding: 36px 0 28px;
        }

        .header-main {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            gap: 20px;
            flex-wrap: wrap;
        }

        .page-header h1 {
            font-size: 2.25rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 0%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.025em;
            margin-bottom: 0;
        }

        .page-header p {
            font-size: 0.95rem;
            color: var(--text-secondary);
            font-weight: 400;
        }

        /* ─── Filter Controls ─── */
        .filter-section {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: var(--accent-glow);
        }

        .filter-row {
            display: flex;
            gap: 16px;
            align-items: center;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 200px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 10px 16px 10px 42px;
            background: rgba(15, 16, 23, 0.6);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            color: var(--text-primary);
            font-family: var(--font-family);
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .search-box input::placeholder {
            color: var(--text-secondary);
            opacity: 0.6;
        }

        .search-box input:focus {
            border-color: rgba(124, 140, 245, 0.4);
            box-shadow: 0 0 0 3px rgba(124, 140, 245, 0.1);
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 1rem;
            pointer-events: none;
        }

        /* Index Toggle Buttons */
        .index-toggles {
            display: flex;
            gap: 6px;
        }

        .index-btn {
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: 600;
            border: 1.5px solid;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: var(--font-family);
            letter-spacing: 0.02em;
        }

        .index-btn.sp500 {
            border-color: var(--sp500-color);
            color: var(--sp500-color);
            background: transparent;
        }
        .index-btn.sp500.active {
            background: rgba(56, 189, 248, 0.15);
            color: var(--sp500-color);
        }
        .index-btn.sp500:hover { background: rgba(56, 189, 248, 0.1); }

        .index-btn.ndx {
            border-color: var(--ndx-color);
            color: var(--ndx-color);
            background: transparent;
        }
        .index-btn.ndx.active {
            background: rgba(167, 139, 250, 0.15);
            color: var(--ndx-color);
        }
        .index-btn.ndx:hover { background: rgba(167, 139, 250, 0.1); }

        .index-btn.dowjones {
            border-color: var(--dow-color);
            color: var(--dow-color);
            background: transparent;
        }
        .index-btn.dowjones.active {
            background: rgba(245, 158, 11, 0.15);
            color: var(--dow-color);
        }
        .index-btn.dowjones:hover { background: rgba(245, 158, 11, 0.1); }

        /* Sector dropdown */
        .sector-select {
            padding: 10px 14px;
            background: rgba(15, 16, 23, 0.6);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            color: var(--text-primary);
            font-family: var(--font-family);
            font-size: 0.85rem;
            outline: none;
            cursor: pointer;
            min-width: 180px;
            transition: border-color 0.2s ease;
        }

        .sector-select:focus {
            border-color: rgba(124, 140, 245, 0.4);
        }

        .sector-select option {
            background: #1a1b26;
            color: var(--text-primary);
        }

        /* ─── Stats Cards ─── */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 16px;
            padding: 16px 18px;
            text-align: center;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--accent-glow);
        }

        .stat-value {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--accent);
            line-height: 1.1;
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-weight: 500;
            margin-top: 4px;
        }

        .stat-card.sp500-stat .stat-value { color: var(--sp500-color); }
        .stat-card.ndx-stat .stat-value { color: var(--ndx-color); }
        .stat-card.dow-stat .stat-value { color: var(--dow-color); }
        .stat-card.overlap-stat .stat-value { color: #34d399; }

        /* ─── Main Table ─── */
        .table-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 20px;
            padding: 0;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
        }

        .table-info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            border-bottom: 1px solid var(--card-border);
        }

        .table-count {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .table-count strong {
            color: var(--accent);
            font-weight: 700;
        }

        .table-wrapper {
            overflow-x: auto;
            max-height: 70vh;
            overflow-y: auto;
        }

        .screener-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }

        .screener-table thead {
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .screener-table th {
            background: rgba(15, 16, 23, 0.95);
            padding: 12px 16px;
            text-align: left;
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 1px solid var(--card-border);
            cursor: pointer;
            user-select: none;
            transition: color 0.2s ease;
            white-space: nowrap;
        }

        .screener-table th:hover {
            color: var(--accent);
        }

        .screener-table th.sorted-asc::after {
            content: ' ▲';
            font-size: 0.65rem;
            color: var(--accent);
        }

        .screener-table th.sorted-desc::after {
            content: ' ▼';
            font-size: 0.65rem;
            color: var(--accent);
        }

        .screener-table th.no-sort {
            cursor: default;
        }
        .screener-table th.no-sort:hover {
            color: var(--text-secondary);
        }

        .screener-table td {
            padding: 10px 16px;
            border-bottom: 1px solid rgba(130, 140, 180, 0.05);
            vertical-align: middle;
        }

        .screener-table tbody tr {
            transition: background 0.15s ease;
        }

        .screener-table tbody tr:hover {
            background: rgba(124, 140, 245, 0.04);
        }

        /* Triple-index highlight */
        .screener-table tbody tr.triple-index {
            background: rgba(52, 211, 153, 0.06);
        }
        .screener-table tbody tr.triple-index:hover {
            background: rgba(52, 211, 153, 0.1);
        }

        .col-rank {
            width: 50px;
            text-align: center;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .col-ticker {
            font-weight: 700;
            color: var(--text-primary);
            font-size: 0.88rem;
            letter-spacing: 0.02em;
        }
        .col-ticker a {
            color: inherit;
            text-decoration: none;
            transition: color 0.15s ease;
        }
        .col-ticker a:hover {
            color: var(--accent);
            text-decoration: underline;
        }

        .col-name {
            color: var(--text-secondary);
            font-weight: 400;
        }

        .col-sector {
            font-size: 0.78rem;
            color: var(--text-secondary);
        }

        .col-price {
            text-align: right;
            font-weight: 600;
            font-size: 0.85rem;
            white-space: nowrap;
        }

        .col-change {
            text-align: right;
            font-size: 0.85rem;
            white-space: nowrap;
        }

        .col-high-dist {
            text-align: right;
            font-size: 0.85rem;
            white-space: nowrap;
        }

        .col-range {
            text-align: center;
            width: 130px;
        }

        /* Watchlist Row Highlight */
        .screener-table tbody tr.watchlist-row {
            background: rgba(251, 191, 36, 0.03);
            border-left: 2px solid #fbbf24;
        }
        .screener-table tbody tr.watchlist-row:hover {
            background: rgba(251, 191, 36, 0.06);
        }

        /* Color Utility Classes */
        .text-green {
            color: #34d399 !important;
            font-weight: 600;
        }
        .text-red {
            color: #f87171 !important;
            font-weight: 600;
        }
        .text-neutral {
            color: var(--text-secondary);
        }
        .text-breakout {
            color: #fbbf24 !important;
            font-weight: 700;
        }
        .breakout-icon {
            font-size: 0.75rem;
            margin-left: 2px;
        }

        .badge-private {
            background: rgba(251, 191, 36, 0.15);
            color: #fbbf24;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 600;
            display: inline-block;
        }

        /* Range Bar Slider */
        .range-container {
            display: flex;
            align-items: center;
            gap: 6px;
            width: 100%;
            min-width: 100px;
            justify-content: center;
        }
        .range-track {
            position: relative;
            height: 4px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 2px;
            flex: 1;
        }
        .range-fill {
            position: absolute;
            width: 6px;
            height: 6px;
            background: var(--accent);
            border-radius: 50%;
            top: -1px;
            transform: translateX(-50%);
            box-shadow: 0 0 8px var(--accent);
        }
        .range-lbl {
            font-size: 0.65rem;
            color: var(--text-secondary);
            font-weight: 600;
        }




        /* Preset Filters Section */
        .preset-section {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 16px;
            border-top: 1px solid rgba(130, 140, 180, 0.08);
            padding-top: 16px;
            width: 100%;
            flex-wrap: wrap;
        }
        .preset-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-weight: 600;
        }
        .preset-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .preset-btn {
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.78rem;
            font-weight: 500;
            border: 1px solid rgba(130, 140, 180, 0.15);
            background: rgba(26, 27, 38, 0.4);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: var(--font-family);
        }
        .preset-btn:hover {
            background: rgba(124, 140, 245, 0.08);
            color: var(--text-primary);
            border-color: rgba(124, 140, 245, 0.3);
        }
        .preset-btn.active {
            background: var(--accent-dim);
            color: var(--accent);
            border-color: var(--accent);
            font-weight: 600;
        }



        /* ─── Responsive ─── */
        @media (max-width: 768px) {
            .filter-row {
                flex-direction: column;
                align-items: stretch;
            }

            .search-box { min-width: 100%; }
            .index-toggles { justify-content: center; }
            .sector-select { width: 100%; }

            .stats-row {
                grid-template-columns: repeat(2, 1fr);
            }

            .page-header h1 { font-size: 1.4rem; }
        }
    </style>
</head>

<body>

    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>

    <main class="container">
        <!-- Page Header -->
        <header class="page-header">
            <div class="header-main">
                <h1>Index Constituents Screener</h1>
                <div class="nav-tabs">
                    <a href="./index.html" class="nav-tab">Dashboard</a>
                    <a href="./screener.html" class="nav-tab active">Screener</a>
                </div>
            </div>
            <p>인덱스 구성종목 검색 & 비교 &nbsp;|&nbsp; <span id="screener-update-date">기준일: -</span></p>
        </header>

        <!-- Stats Cards -->
        <div class="stats-row" id="stats-row">
            <div class="stat-card">
                <div class="stat-value" id="stat-total">-</div>
                <div class="stat-label">전체 고유 종목</div>
            </div>
            <div class="stat-card sp500-stat">
                <div class="stat-value" id="stat-sp500">-</div>
                <div class="stat-label">S&P 500</div>
            </div>
            <div class="stat-card ndx-stat">
                <div class="stat-value" id="stat-ndx">-</div>
                <div class="stat-label">Nasdaq-100</div>
            </div>
            <div class="stat-card dow-stat">
                <div class="stat-value" id="stat-dow">-</div>
                <div class="stat-label">Dow Jones</div>
            </div>
            <div class="stat-card overlap-stat">
                <div class="stat-value" id="stat-filtered">-</div>
                <div class="stat-label">필터 결과</div>
            </div>
        </div>

        <!-- Filter Controls -->
        <div class="filter-section">
            <div class="filter-row">
                <div class="search-box">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="search-input" placeholder="티커 또는 종목명으로 검색..." autocomplete="off">
                </div>
                <div class="index-toggles">
                    <button class="index-btn sp500 active" data-index="sp500" onclick="toggleIndex(this)">S&P 500</button>
                    <button class="index-btn ndx active" data-index="nasdaq100" onclick="toggleIndex(this)">NDX</button>
                    <button class="index-btn dowjones active" data-index="dowjones" onclick="toggleIndex(this)">Dow Jones</button>
                </div>
                <select class="sector-select" id="sector-filter" onchange="applyFilters()">
                    <option value="">전체 섹터</option>
                </select>
            </div>
            <!-- Preset Buttons -->
            <div class="preset-section">
                <span class="preset-label">🔥 모멘텀 프리셋:</span>
                <div class="preset-buttons">
                    <button class="preset-btn active" id="preset-all" onclick="selectPreset('all')">전체 종목</button>
                    <button class="preset-btn" id="preset-breakout" onclick="selectPreset('breakout')">신고가 임박 🚀</button>
                    <button class="preset-btn" id="preset-leaders" onclick="selectPreset('leaders')">단기 주도주 🔥</button>
                    <button class="preset-btn" id="preset-golden" onclick="selectPreset('golden')">상승 정배열 📈</button>
                    <button class="preset-btn" id="preset-overbought" onclick="selectPreset('overbought')">과매수 🔴</button>
                    <button class="preset-btn" id="preset-watchlist" onclick="selectPreset('watchlist')">나의 관심종목 ⭐⭐</button>
                </div>
            </div>
        </div>

        <!-- Main Table -->
        <div class="table-card">
            <div class="table-info-bar">
                <span class="table-count" id="table-count">로딩 중...</span>
                <span style="font-size: 0.75rem; color: var(--text-secondary);">⭐⭐ 관심종목 하이라이트</span>
            </div>
            <div class="table-wrapper">
                <table class="screener-table" id="screener-table">
                    <thead>
                        <tr>
                            <th class="no-sort" style="width:50px; text-align:center;">#</th>
                            <th data-sort="ticker">Ticker</th>
                            <th data-sort="name">Company</th>
                            <th data-sort="sector">Sector</th>
                            <th data-sort="price" style="text-align:right;">Price</th>
                            <th data-sort="pct_1d" style="text-align:right; width:70px;">1D</th>
                            <th data-sort="pct_1w" style="text-align:right; width:70px;">1W</th>
                            <th data-sort="pct_1m" style="text-align:right; width:70px;">1M</th>
                            <th data-sort="pct_6m" style="text-align:right; width:70px;">6M</th>
                            <th data-sort="pct_ytd" style="text-align:right; width:70px;">YTD</th>
                            <th data-sort="pct_1y" style="text-align:right; width:70px;">1Y</th>
                            <th data-sort="ema_signal" style="text-align:center; width:90px;" title="EMA8 · EMA21 기준: ⭐⭐⭐ 두 이평선 모두 상회 / ⭐⭐ 사이 / ⭐ 두 이평선 모두 하회">EMA8/21</th>
                            <th data-sort="dist_sma20" style="text-align:right; width:90px;" title="SMA20 대비 현재 주가 이격도 (%)">SMA20 Dist</th>
                            <th data-sort="rsi14" style="text-align:right; width:70px;" title="RSI-14 (≥70 과매수·붉은색, ≤30 과매도·초록색)">RSI</th>
                            <th data-sort="dist_high" style="text-align:right; width:110px;">52W High</th>
                            <th class="no-sort" style="text-align:center; width:120px;">52W Range</th>
                        </tr>
                    </thead>
                    <tbody id="screener-body">
                        <tr><td colspan="16" style="text-align:center; padding:40px; color:var(--text-secondary);">데이터 로딩 중...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>


    </main>

    <script src="./data/index_constituents.js"></script>
    <script>
        // ─── State ───
        let allStocks = [];
        let filteredStocks = [];
        let activeIndices = { sp500: true, nasdaq100: true, dowjones: true };
        let activePreset = 'all';
        // Sorting state
        let currentSortKey = '';
        let currentSortDir = 'desc';

        // ─── Load Data ───
        function initScreener(data) {
            processData(data);
            populateSectorFilter();
            applyFilters();
            updateGlobalStats();
            updateSortHeaders();
            if (data.date) {
                document.getElementById('screener-update-date').textContent = `기준일: ${data.date}`;
            }
        }

        const isLocalFile = window.location.protocol === 'file:';
        const dataUrl = isLocalFile ? './data/index_constituents.json' : `./data/index_constituents.json?_=${Date.now()}`;

        fetch(dataUrl)
            .then(r => { if (!r.ok) throw new Error('fetch 실패'); return r.json(); })
            .then(data => initScreener(data))
            .catch(err => {
                console.warn('fetch 실패, JS 백업 사용:', err);
                if (typeof INDEX_DATA !== 'undefined') {
                    initScreener(INDEX_DATA);
                } else {
                    document.getElementById('screener-body').innerHTML =
                        `<tr><td colspan="16" style="text-align:center;padding:40px;color:#ef4444;">❌ 데이터 로딩 실패</td></tr>`;
                }
            });

        // ─── Process raw JSON into unified stock list ───
        function processData(data) {
            allStocks = data.stocks || [];
            allStocks.sort((a, b) => a.ticker.localeCompare(b.ticker));
        }

        // ─── Populate Sector Dropdown ───
        function populateSectorFilter() {
            const sectors = new Set();
            allStocks.forEach(s => { if (s.sector) sectors.add(s.sector); });
            const sorted = [...sectors].sort();
            const select = document.getElementById('sector-filter');
            sorted.forEach(sec => {
                const opt = document.createElement('option');
                opt.value = sec;
                opt.textContent = sec;
                select.appendChild(opt);
            });
        }

        // ─── Toggle Index Filter ───
        function toggleIndex(btn) {
            const idx = btn.dataset.index;
            activeIndices[idx] = !activeIndices[idx];
            btn.classList.toggle('active');
            applyFilters();
        }

        // ─── Select Preset Filter ───
        function selectPreset(preset) {
            activePreset = preset;
            
            // Toggle active button class
            document.querySelectorAll('.preset-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            const activeBtn = document.getElementById(`preset-${preset}`);
            if (activeBtn) activeBtn.classList.add('active');
            
            applyFilters();
        }

        // ─── Apply All Filters ───
        function applyFilters() {
            const query = document.getElementById('search-input').value.toLowerCase().trim();
            const sectorVal = document.getElementById('sector-filter').value;

            // Determine if any index filter is active
            const anyIndexActive = Object.values(activeIndices).some(v => v);

            filteredStocks = allStocks.filter(stock => {
                // Sector filter
                if (sectorVal && stock.sector !== sectorVal) return false;

                // Search filter
                if (query) {
                    const matchTicker = stock.ticker.toLowerCase().includes(query);
                    const matchName = stock.name.toLowerCase().includes(query);
                    if (!matchTicker && !matchName) return false;
                }

                // Index filter (ignored if preset is 'watchlist')
                if (activePreset !== 'watchlist' && anyIndexActive) {
                    let inAnyActive = false;
                    if (activeIndices.sp500 && stock.sp500) inAnyActive = true;
                    if (activeIndices.nasdaq100 && stock.nasdaq100) inAnyActive = true;
                    if (activeIndices.dowjones && stock.dowjones) inAnyActive = true;
                    if (!inAnyActive) return false;
                }

                // Preset filters
                if (activePreset === 'breakout') {
                    if (stock.dist_high === null || stock.dist_high < -3.0) return false;
                } else if (activePreset === 'golden') {
                    if (stock.dist_ma50 === null || stock.dist_ma50 <= 0) return false;
                    if (stock.dist_ma200 === null || stock.dist_ma200 <= 0) return false;
                } else if (activePreset === 'overbought') {
                    if (stock.rsi14 === null || stock.rsi14 <= 70) return false;
                } else if (activePreset === 'watchlist') {
                    if (!stock.is_watchlist) return false;
                }

                return true;
            });

            // Special handling for 'leaders' preset
            if (activePreset === 'leaders') {
                const leaders = [...filteredStocks]
                    .filter(s => s.pct_1m !== null)
                    .sort((a, b) => b.pct_1m - a.pct_1m)
                    .slice(0, 50);
                const leaderTickers = new Set(leaders.map(s => s.ticker));
                filteredStocks = filteredStocks.filter(s => leaderTickers.has(s.ticker));
            }

            // Apply sort
            sortStocks();
            renderTable();
            updateFilteredCount();
        }

        // ─── Single Column Sorting ───
        function sortStocks() {
            if (!currentSortKey) return; // no sort applied
            filteredStocks.sort((a, b) => {
                let va = a[currentSortKey];
                let vb = b[currentSortKey];

                // Null values always go to the bottom
                if ((va === null || va === undefined) && (vb === null || vb === undefined)) return 0;
                if (va === null || va === undefined) return 1;
                if (vb === null || vb === undefined) return -1;

                let cmp;
                if (typeof va === 'string') {
                    const sa = va.toLowerCase();
                    const sb = (vb || '').toLowerCase();
                    cmp = sa < sb ? -1 : sa > sb ? 1 : 0;
                } else {
                    cmp = va - vb;
                }
                return currentSortDir === 'asc' ? cmp : -cmp;
            });
        }

        // ─── Intelligent Default Sort Direction ───
        function getDefaultSortDir(key) {
            // Text columns sort ascending first (alphabetical order)
            if (['ticker', 'name', 'sector'].includes(key)) {
                return 'asc';
            }
            // Numeric and performance columns sort descending first (highest values first)
            return 'desc';
        }

        // ─── Update header visuals ───
        function updateSortHeaders() {
            document.querySelectorAll('.screener-table th[data-sort]').forEach(th => {
                th.classList.remove('sorted-asc', 'sorted-desc');
                const key = th.dataset.sort;
                if (key === currentSortKey) {
                    th.classList.add(currentSortDir === 'asc' ? 'sorted-asc' : 'sorted-desc');
                }
            });
        }

        // ─── Table Header Click Sort ───
        document.querySelectorAll('.screener-table th[data-sort]').forEach(th => {
            th.addEventListener('click', () => {
                const key = th.dataset.sort;
                if (currentSortKey === key) {
                    currentSortDir = currentSortDir === 'asc' ? 'desc' : 'asc';
                } else {
                    currentSortKey = key;
                    currentSortDir = getDefaultSortDir(key);
                }
                updateSortHeaders();
                sortStocks();
                renderTable();
            });
        });

        // ─── Search Input Handler ───
        document.getElementById('search-input').addEventListener('input', () => {
            applyFilters();
        });

        // ─── Finviz URL generator ───
        function getFinvizUrl(ticker) {
            if (ticker.endsWith('.KS') || ticker.endsWith('.KQ')) {
                return `https://finance.yahoo.com/quote/${ticker}`;
            }
            return `https://finviz.com/quote.ashx?t=${encodeURIComponent(ticker)}`;
        }

        // ─── Price formatter ───
        function formatPrice(stock) {
            if (stock.is_private) return '<span class="badge-private">비상장</span>';
            if (stock.price === null || stock.price === undefined) return '-';
            if (stock.ticker.endsWith('.KS')) {
                return '₩' + Math.round(stock.price).toLocaleString();
            }
            return '$' + stock.price.toFixed(2);
        }

        // ─── Change formatter ───
        function formatChange(val) {
            if (val === null || val === undefined) return '<span style="color:var(--text-secondary)">-</span>';
            const isPositive = val > 0;
            const isNegative = val < 0;
            const sign = isPositive ? '+' : '';
            const colorClass = isPositive ? 'text-green' : (isNegative ? 'text-red' : 'text-neutral');
            return `<span class="${colorClass}">${sign}${val.toFixed(2)}%</span>`;
        }

        // ─── 52W High Distance formatter ───
        function formatHighDist(val) {
            if (val === null || val === undefined) return '<span style="color:var(--text-secondary)">-</span>';
            const isNear = val >= -3.0;
            const badge = isNear ? ' <span class="breakout-icon">🚀</span>' : '';
            const colorClass = isNear ? 'text-breakout' : 'text-neutral';
            return `<span class="${colorClass}">${val.toFixed(2)}%${badge}</span>`;
        }

        // ─── Range bar renderer ───
        function renderRangeBar(stock) {
            if (stock.is_private || stock.price === null || stock.dist_low === null || stock.dist_high === null) return '-';
            
            const low = stock.price / (1 + stock.dist_low / 100);
            const high = stock.price / (1 + stock.dist_high / 100);
            const range = high - low;
            const pos_pct = range > 0 ? ((stock.price - low) / range) * 100 : 50;
            const clamped = Math.max(0, Math.min(100, pos_pct));

            return `
                <div class="range-container">
                    <span class="range-lbl">L</span>
                    <div class="range-track">
                        <div class="range-fill" style="left: ${clamped}%;"></div>
                    </div>
                    <span class="range-lbl">H</span>
                </div>
            `;
        }

        // ─── EMA Signal formatter ───
        function formatEmaSignal(val) {
            if (val === null || val === undefined) return '<span style="color:var(--text-secondary)">-</span>';
            if (val === 3) return '<span style="font-size:0.9rem; letter-spacing:-1px;" title="두 이평선 모두 상회 (강세)">⭐⭐⭐</span>';
            if (val === 2) return '<span style="font-size:0.9rem; letter-spacing:-1px; opacity:0.75;" title="두 이평선 사이 (중립)">⭐⭐</span>';
            return '<span style="font-size:0.9rem; letter-spacing:-1px; opacity:0.45;" title="두 이평선 모두 하회 (약세)">⭐</span>';
        }

        // ─── RSI formatter ───
        function formatRsi(val) {
            if (val === null || val === undefined) return '<span style="color:var(--text-secondary)">-</span>';
            let colorStyle;
            if (val >= 70) {
                colorStyle = 'color:#f87171; font-weight:700;'; // 과매수 — 빨강
            } else if (val <= 30) {
                colorStyle = 'color:#34d399; font-weight:700;'; // 과매도 — 초록
            } else {
                colorStyle = 'color:var(--text-primary); font-weight:500;';
            }
            return `<span style="${colorStyle}">${val.toFixed(1)}</span>`;
        }

        // ─── Render Table ───
        function renderTable() {
            const tbody = document.getElementById('screener-body');

            if (filteredStocks.length === 0) {
                tbody.innerHTML = `<tr><td colspan="16" style="text-align:center; padding:40px; color:var(--text-secondary);">검색 결과가 없습니다</td></tr>`;
                return;
            }

            let html = '';
            filteredStocks.forEach((stock, idx) => {
                const rowClass = stock.is_watchlist ? ' class="watchlist-row"' : '';
                const starBadge = stock.is_watchlist ? '<span style="color: #fbbf24; font-size: 0.75rem; margin-right: 4px;">⭐⭐</span>' : '';
                const sectorDisplay = stock.sector || '<span style="opacity:0.3">-</span>';

                html += `<tr${rowClass}>
                    <td class="col-rank">${idx + 1}</td>
                    <td class="col-ticker">${starBadge}<a href="${getFinvizUrl(stock.ticker)}" target="_blank" rel="noopener noreferrer">${stock.ticker}</a></td>
                    <td class="col-name">${stock.name}</td>
                    <td class="col-sector">${sectorDisplay}</td>
                    <td class="col-price">${formatPrice(stock)}</td>
                    <td class="col-change">${formatChange(stock.pct_1d)}</td>
                    <td class="col-change">${formatChange(stock.pct_1w)}</td>
                    <td class="col-change">${formatChange(stock.pct_1m)}</td>
                    <td class="col-change">${formatChange(stock.pct_6m)}</td>
                    <td class="col-change">${formatChange(stock.pct_ytd)}</td>
                    <td class="col-change">${formatChange(stock.pct_1y)}</td>
                    <td style="text-align:center;">${formatEmaSignal(stock.ema_signal)}</td>
                    <td class="col-change">${formatChange(stock.dist_sma20)}</td>
                    <td style="text-align:right;">${formatRsi(stock.rsi14)}</td>
                    <td class="col-high-dist">${formatHighDist(stock.dist_high)}</td>
                    <td class="col-range">${renderRangeBar(stock)}</td>
                </tr>`;
            });

            tbody.innerHTML = html;
        }

        // ─── Update Counts ───
        function updateFilteredCount() {
            document.getElementById('stat-filtered').textContent = filteredStocks.length;
            document.getElementById('table-count').innerHTML = `<strong>${filteredStocks.length}</strong>개 종목 표시 중`;
        }

        function updateGlobalStats() {
            document.getElementById('stat-total').textContent = allStocks.length;
            
            let spCount = 0;
            let ndxCount = 0;
            let dowCount = 0;
            
            allStocks.forEach(s => {
                if (s.sp500) spCount++;
                if (s.nasdaq100) ndxCount++;
                if (s.dowjones) dowCount++;
            });

            document.getElementById('stat-sp500').textContent = spCount;
            document.getElementById('stat-ndx').textContent = ndxCount;
            document.getElementById('stat-dow').textContent = dowCount;
        }


    </script>
</body>

</html>
