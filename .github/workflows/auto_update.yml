name: Auto Daily Data Update

on:
  schedule:
    # 한국 시간(KST) 매일 오전 7시 = UTC 매일 오후 10시 (22:00)
    # cron 형식: '분 시 일 월 요일' (UTC 기준)
    - cron: '0 22 * * *'
  workflow_dispatch: # GitHub 웹페이지에서 수동으로 '실행' 버튼을 눌러 돌릴 수도 있게 합니다.

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
    # 1. 가상 컴퓨터에 내 저장소의 코드들을 다운로드합니다.
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. 파이썬(Python 3.10) 환경을 설치합니다.
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. 데이터 수집에 필요한 라이브러리(requests, beautifulsoup4)를 설치합니다.
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    # 4. 데이터 수집 파이썬 스크립트를 실행합니다.
    - name: Run update script
      run: python update_data.py

    # 5. 실행 결과로 변경된 data.json과 data.js 파일을 깃허브 저장소에 자동으로 커밋&푸시(저장)합니다.
    - name: Commit and Push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add data.json data.js
        # 변경사항이 있을 때만 커밋을 수행하여 에러를 방지합니다.
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update market data and assets ranking [skip ci]" && git push)
