name: Update Daily Dashboard Data

on:
  schedule:
    - cron: '0 22 * * *' # 매일 한국 시간 오전 7시 자동 실행 (UTC 22:00)
  workflow_dispatch: # 수동으로 즉시 실행해볼 수 있는 버튼 활성화

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
    - name: 저장소 코드 가져오기
      uses: actions/checkout@v3

    - name: 파이썬 환경 설정
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 필요한 패키지 설치
      run: |
        pip install requests beautifulsoup4

    - name: 파이썬 스크립트 실행
      run: python update_data.py

    - name: 업데이트된 데이터를 저장소에 기록
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add data.json
        git commit -m "Update daily dashboard data" || exit 0
        git push
