name: Daily Data Update

on:
  schedule:
    - cron: '20 22 * * *' # 22:20 UTC == 07:20 KST
  workflow_dispatch: # Github 웹사이트에서 수동으로도 실행 가능하게 버튼 추가

permissions:
  contents: write # Github Actions가 저장소에 Push할 수 있도록 쓰기 권한 부여

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Data Update Scripts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python update_data.py
          python update_screener.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git add data.js data.json
          git diff --staged --quiet || git commit -m "Auto: Daily data update via GitHub Actions"
          git push
