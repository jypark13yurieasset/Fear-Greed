<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insight | Jypark13 Investment Dashboard</title>
    <meta name="description" content="투자 인사이트와 시장 분석을 제공하는 대시보드입니다.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at 50% 50%, #1a1b26 0%, #0f1017 100%);
            --card-bg: rgba(26, 27, 38, 0.6);
            --card-border: rgba(130, 140, 180, 0.1);
            --text-primary: #e1e4ed;
            --text-secondary: #8b92a8;
            --accent-glow: 0 15px 35px -10px rgba(130, 140, 200, 0.08);
            --font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --accent: #7c8cf5;
            --accent-dim: rgba(124, 140, 245, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            background: var(--bg-gradient);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 40px 20px;
            line-height: 1.6;
            position: relative;
            overflow-x: hidden;
        }

        /* Ambient glowing backgrounds */
        .bg-glow-1 {
            position: fixed;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(100, 110, 180, 0.06) 0%, rgba(100, 110, 180, 0) 70%);
            top: -10%;
            left: -10%;
            z-index: 0;
            pointer-events: none;
        }

        .bg-glow-2 {
            position: fixed;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(90, 100, 170, 0.05) 0%, rgba(90, 100, 170, 0) 70%);
            bottom: -10%;
            right: -10%;
            z-index: 0;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 1120px;
            margin: 0 auto;
            z-index: 1;
            position: relative;
        }

        .page-header {
            margin-bottom: 30px;
        }

        .header-main {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            gap: 20px;
            flex-wrap: wrap;
        }

        .page-header h1 {
            font-size: 2.25rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 0%, #7c8cf5 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.025em;
            margin-bottom: 0;
        }

        .page-header p {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        /* ─── Navigation Bar ─── */
        .nav-tabs {
            display: flex;
            gap: 4px;
            background: rgba(26, 27, 38, 0.5);
            padding: 4px;
            border-radius: 12px;
            border: 1px solid rgba(130, 140, 180, 0.1);
        }

        .nav-tab {
            padding: 8px 20px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
            text-decoration: none;
            transition: all 0.2s ease;
            position: relative;
        }

        .nav-tab:hover {
            color: var(--text-primary);
            background: rgba(124, 140, 245, 0.08);
        }

        .nav-tab.active {
            color: var(--accent);
            background: var(--accent-dim);
            font-weight: 600;
        }

        /* ─── Content Area ─── */
        .insight-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 400px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 60px 40px;
            text-align: center;
            backdrop-filter: blur(12px);
            box-shadow: var(--accent-glow);
        }

        .insight-placeholder .icon {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.7;
        }

        .insight-placeholder h2 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #ffffff 0%, #7c8cf5 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .insight-placeholder p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            max-width: 500px;
            line-height: 1.7;
        }
    </style>
</head>

<body>
    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>

    <div class="container">
        <header class="page-header">
            <div class="header-main">
                <h1>Investment Insight</h1>
                <div class="nav-tabs">
                    <a href="./index.html" class="nav-tab">Dashboard</a>
                    <a href="./screener.html" class="nav-tab">Screener</a>
                    <a href="./insight.html" class="nav-tab active">Insight</a>
                </div>
            </div>
            <p>투자 인사이트 &amp; 시장 분석</p>
        </header>

        <div class="insight-placeholder">
            <div class="icon">🔮</div>
            <h2>Coming Soon</h2>
            <p>투자 인사이트 기능이 준비 중입니다. 시장 분석, 포트폴리오 추천, 매매 시그널 히스토리 등 다양한 기능이 추가될 예정입니다.</p>
        </div>
    </div>
</body>

</html>
