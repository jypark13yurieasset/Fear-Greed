<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insight | Jypark13 Investment Dashboard</title>
    <meta name="description" content="투자 인사이트와 시장 분석을 제공하는 대시보드입니다.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at 50% 50%, #1a1b26 0%, #0f1017 100%);
            --card-bg: rgba(26, 27, 38, 0.6);
            --card-border: rgba(130, 140, 180, 0.1);
            --text-primary: #e1e4ed;
            --text-secondary: #8b92a8;
            --accent-glow: 0 15px 35px -10px rgba(130, 140, 200, 0.08);
            --font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --accent: #7c8cf5;
            --accent-dim: rgba(124, 140, 245, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            background: var(--bg-gradient);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 40px 20px;
            line-height: 1.6;
            position: relative;
            overflow-x: hidden;
        }

        /* Ambient glowing backgrounds */
        .bg-glow-1 {
            position: fixed;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(100, 110, 180, 0.06) 0%, rgba(100, 110, 180, 0) 70%);
            top: -10%;
            left: -10%;
            z-index: 0;
            pointer-events: none;
        }

        .bg-glow-2 {
            position: fixed;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(90, 100, 170, 0.05) 0%, rgba(90, 100, 170, 0) 70%);
            bottom: -10%;
            right: -10%;
            z-index: 0;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 1120px;
            margin: 0 auto;
            z-index: 1;
            position: relative;
        }

        .page-header {
            margin-bottom: 30px;
        }

        .header-main {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            gap: 20px;
            flex-wrap: wrap;
        }

        .page-header h1 {
            font-size: 2.25rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 0%, #7c8cf5 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.025em;
            margin-bottom: 0;
        }

        .page-header p {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        /* ─── Navigation Bar ─── */
        .nav-tabs {
            display: flex;
            gap: 4px;
            background: rgba(26, 27, 38, 0.5);
            padding: 4px;
            border-radius: 12px;
            border: 1px solid rgba(130, 140, 180, 0.1);
        }

        .nav-tab {
            padding: 8px 20px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
            text-decoration: none;
            transition: all 0.2s ease;
            position: relative;
        }

        .nav-tab:hover {
            color: var(--text-primary);
            background: rgba(124, 140, 245, 0.08);
        }

        .nav-tab.active {
            color: var(--accent);
            background: var(--accent-dim);
            font-weight: 600;
        }

        /* ─── Insight Layout ─── */
        .insight-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 10px;
        }

        @media (max-width: 900px) {
            .insight-grid {
                grid-template-columns: 1fr;
            }
        }

        .insight-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(12px);
            box-shadow: var(--accent-glow);
            display: flex;
            flex-direction: column;
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* ─── Sector Ranking ─── */
        .sector-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .sector-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 15px;
            transition: all 0.2s ease;
        }

        .sector-item:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(124, 140, 245, 0.3);
        }

        .sector-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .sector-stats {
            display: flex;
            gap: 15px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .stat-value.positive { color: #00d26a; }
        .stat-value.negative { color: #f93c65; }

        .progress-bar-container {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #7c8cf5, #00d26a);
            border-radius: 3px;
            transition: width 1s ease;
        }

        /* ─── Signal History ─── */
        .winrate-summary {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .winrate-box {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
        }

        .winrate-box.golden .value { color: #00d26a; }
        .winrate-box.dead .value { color: #f93c65; }

        .winrate-box .label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .winrate-box .value {
            font-size: 1.8rem;
            font-weight: 800;
        }

        .signal-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
            max-height: 500px;
            padding-right: 5px;
        }
        
        .signal-list::-webkit-scrollbar {
            width: 6px;
        }
        .signal-list::-webkit-scrollbar-thumb {
            background-color: rgba(130, 140, 180, 0.3);
            border-radius: 3px;
        }

        .signal-item {
            background: rgba(255, 255, 255, 0.02);
            border-left: 3px solid transparent;
            padding: 12px 15px;
            border-radius: 8px;
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr;
            align-items: center;
            font-size: 0.85rem;
        }

        .signal-item.golden { border-left-color: #00d26a; }
        .signal-item.dead { border-left-color: #f93c65; }

        .signal-info .ticker { font-weight: 700; color: #fff; }
        .signal-info .date { font-size: 0.75rem; color: var(--text-secondary); }

        .badge {
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            text-align: center;
        }

        .badge.win { background: rgba(0, 210, 106, 0.15); color: #00d26a; }
        .badge.loss { background: rgba(249, 60, 101, 0.15); color: #f93c65; }
        .badge.pending { background: rgba(139, 146, 168, 0.15); color: #8b92a8; }

    </style>
</head>

<body>
    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>

    <div class="container">
        <header class="page-header">
            <div class="header-main">
                <h1>Investment Insight</h1>
                <div class="nav-tabs">
                    <a href="./index.html" class="nav-tab">Dashboard</a>
                    <a href="./screener.html" class="nav-tab">Screener</a>
                    <a href="./insight.html" class="nav-tab active">Insight</a>
                </div>
            </div>
            <p>투자 인사이트 &amp; 시장 분석</p>
        </header>

        <div class="insight-grid">
            <!-- 섹터별 랭킹 -->
            <div class="insight-card">
                <h2 class="card-title">🏆 Sector Momentum Ranking</h2>
                <div id="sector-ranking-container" class="sector-list">
                    <!-- JS Injected -->
                </div>
            </div>

            <!-- 시그널 히스토리 보드 -->
            <div class="insight-card">
                <h2 class="card-title">🎯 Signal Win Rate (Past 30 Days)</h2>
                <div class="winrate-summary">
                    <div class="winrate-box golden">
                        <div class="label">Golden Cross Win Rate</div>
                        <div class="value" id="golden-winrate">--%</div>
                    </div>
                    <div class="winrate-box dead">
                        <div class="label">Dead Cross Win Rate</div>
                        <div class="value" id="dead-winrate">--%</div>
                    </div>
                </div>
                
                <div style="display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; font-size: 0.75rem; color: var(--text-secondary); padding: 0 15px 10px; font-weight: 600;">
                    <div>종목 / 발생일</div>
                    <div style="text-align: right;">발생가</div>
                    <div style="text-align: right;">현재가</div>
                    <div style="text-align: right;">결과</div>
                </div>
                <div id="signal-history-container" class="signal-list">
                    <!-- JS Injected -->
                </div>
            </div>
        </div>
    </div>

    <!-- Data Scripts -->
    <script src="./data/index_constituents.js"></script>
    <script src="./data/signal_log.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderSectorRanking();
            renderSignalHistory();
        });

        function renderSectorRanking() {
            if (typeof INDEX_DATA === 'undefined') return;

            const stocks = INDEX_DATA.stocks || [];
            const sectors = {};

            // 그룹핑
            stocks.forEach(s => {
                const sector = s.sector || 'Unknown';
                if (!sectors[sector]) {
                    sectors[sector] = { name: sector, count: 0, sum1w: 0, aboveEma8: 0 };
                }
                sectors[sector].count++;
                if (s.pct_1w) sectors[sector].sum1w += s.pct_1w;
                // ema_signal >= 3 means price > ema8 (단기 상승 모멘텀)
                if (s.ema_signal && s.ema_signal >= 3) sectors[sector].aboveEma8++;
            });

            // 평균 계산 및 정렬
            const ranking = Object.values(sectors).map(sec => {
                sec.avg1w = sec.sum1w / sec.count;
                sec.strength = (sec.aboveEma8 / sec.count) * 100; // EMA8 위에 있는 비율
                // 점수 산정: 1W 수익률 기준 정렬
                return sec;
            }).filter(sec => sec.count > 5 && sec.name !== 'Unknown')
              .sort((a, b) => b.avg1w - a.avg1w);

            const container = document.getElementById('sector-ranking-container');
            container.innerHTML = '';

            ranking.forEach((sec, idx) => {
                const isPos = sec.avg1w > 0;
                const sign = isPos ? '+' : '';
                const colorClass = isPos ? 'positive' : 'negative';

                const html = `
                    <div class="sector-item">
                        <div class="sector-header">
                            <span>${idx + 1}. ${sec.name} <span style="font-size: 0.8rem; color: var(--text-secondary); font-weight: 400;">(${sec.count} stocks)</span></span>
                            <span class="stat-value ${colorClass}" style="font-weight: 700;">${sign}${sec.avg1w.toFixed(2)}%</span>
                        </div>
                        <div class="sector-stats">
                            <div>EMA8 돌파 비율 (단기 추세): <span style="color: #fff;">${sec.strength.toFixed(1)}%</span></div>
                        </div>
                        <div class="progress-bar-container">
                            <div class="progress-bar-fill" style="width: ${sec.strength}%"></div>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', html);
            });
        }

        function renderSignalHistory() {
            if (typeof SIGNAL_LOG_DATA === 'undefined' || typeof INDEX_DATA === 'undefined') return;

            // 현재가 매핑을 위한 딕셔너리
            const priceMap = {};
            (INDEX_DATA.stocks || []).forEach(s => {
                priceMap[s.ticker] = s.price;
            });

            let goldenTotal = 0, goldenWins = 0;
            let deadTotal = 0, deadWins = 0;

            // 최신 날짜 순 정렬
            const logs = [...SIGNAL_LOG_DATA].sort((a, b) => new Date(b.date) - new Date(a.date));

            const container = document.getElementById('signal-history-container');
            container.innerHTML = '';

            logs.forEach(log => {
                const currentPrice = priceMap[log.ticker];
                let isWin = null;
                let returnPct = 0;

                if (currentPrice && log.entry_price) {
                    returnPct = ((currentPrice - log.entry_price) / log.entry_price) * 100;
                    
                    if (log.type === 'golden') {
                        isWin = currentPrice > log.entry_price;
                        goldenTotal++;
                        if (isWin) goldenWins++;
                    } else if (log.type === 'dead') {
                        isWin = currentPrice < log.entry_price; // 데드크로스는 떨어져야 Win
                        deadTotal++;
                        if (isWin) deadWins++;
                    }
                }

                const sign = returnPct > 0 ? '+' : '';
                const typeIcon = log.type === 'golden' ? '🚀' : '💀';
                
                let badgeHtml = `<div class="badge pending">Pending</div>`;
                if (isWin === true) badgeHtml = `<div class="badge win">Win (${sign}${returnPct.toFixed(1)}%)</div>`;
                else if (isWin === false) badgeHtml = `<div class="badge loss">Loss (${sign}${returnPct.toFixed(1)}%)</div>`;

                const html = `
                    <div class="signal-item ${log.type}">
                        <div class="signal-info">
                            <div class="ticker">${typeIcon} ${log.ticker} <span style="font-weight: 400; font-size: 0.75rem;">${log.name}</span></div>
                            <div class="date">${log.date}</div>
                        </div>
                        <div style="text-align: right; font-family: monospace;">$${log.entry_price ? log.entry_price.toFixed(2) : '-'}</div>
                        <div style="text-align: right; font-family: monospace; color: #fff;">$${currentPrice ? currentPrice.toFixed(2) : '-'}</div>
                        <div style="text-align: right;">${badgeHtml}</div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', html);
            });

            // 승률 업데이트
            const goldenWinRate = goldenTotal > 0 ? ((goldenWins / goldenTotal) * 100).toFixed(1) : '--';
            const deadWinRate = deadTotal > 0 ? ((deadWins / deadTotal) * 100).toFixed(1) : '--';

            document.getElementById('golden-winrate').innerText = `${goldenWinRate}%`;
            document.getElementById('dead-winrate').innerText = `${deadWinRate}%`;
        }
    </script>
