<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실적 및 재무 정보 | Jypark13 Dashboard</title>
    <meta name="description" content="종목 티커를 입력하여 실시간 실적(Earnings) 및 재무 정보를 쉽게 확인하세요.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at 50% 50%, #1a1b26 0%, #0f1017 100%);
            --card-bg: rgba(26, 27, 38, 0.6);
            --card-border: rgba(130, 140, 180, 0.1);
            --text-primary: #e1e4ed;
            --text-secondary: #8b92a8;
            --accent-glow: 0 15px 35px -10px rgba(130, 140, 200, 0.08);
            --font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --color-primary: #7c8cf5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            background: var(--bg-gradient);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 40px 20px;
            line-height: 1.6;
            position: relative;
            overflow-x: hidden;
        }

        .bg-glow-1 {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(100, 110, 180, 0.06) 0%, rgba(100, 110, 180, 0) 70%);
            top: -10%;
            left: -10%;
            z-index: 0;
            pointer-events: none;
        }

        .bg-glow-2 {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(90, 100, 170, 0.05) 0%, rgba(90, 100, 170, 0) 70%);
            bottom: -10%;
            right: -10%;
            z-index: 0;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 1120px;
            margin: 0 auto;
            z-index: 1;
            position: relative;
        }

        .dashboard-header {
            margin-bottom: 30px;
        }

        .header-main {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            gap: 20px;
            flex-wrap: wrap;
        }

        h1.dashboard-title {
            font-size: 2.25rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 0%, #7c8cf5 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.025em;
            margin-bottom: 0;
        }

        .nav-tabs {
            display: flex;
            gap: 4px;
            background: rgba(26, 27, 38, 0.5);
            padding: 4px;
            border-radius: 12px;
            border: 1px solid rgba(130, 140, 180, 0.1);
        }

        .nav-tab {
            padding: 8px 20px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .nav-tab:hover {
            color: var(--text-primary);
            background: rgba(124, 140, 245, 0.08);
        }

        .nav-tab.active {
            color: #7c8cf5;
            background: rgba(124, 140, 245, 0.15);
            font-weight: 600;
        }

        .dashboard-subtitle {
            font-size: 0.95rem;
            color: var(--text-secondary);
            font-weight: 400;
        }

        .search-container {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: var(--accent-glow);
        }

        .search-input {
            flex-grow: 1;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 16px 20px;
            color: var(--text-primary);
            font-family: var(--font-family);
            font-size: 1.1rem;
            font-weight: 500;
            outline: none;
            transition: all 0.3s;
        }

        .search-input:focus {
            border-color: var(--color-primary);
            background: rgba(0, 0, 0, 0.4);
            box-shadow: 0 0 0 2px rgba(124, 140, 245, 0.2);
        }

        .search-input::placeholder {
            color: var(--text-secondary);
        }

        .search-button {
            background: var(--color-primary);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 16px 32px;
            font-family: var(--font-family);
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .search-button:hover {
            background: #6b7aec;
            transform: translateY(-1px);
        }

        /* ─── Widget Layout ─── */
        .widgets-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-top: 24px;
        }

        @media (min-width: 900px) {
            .widgets-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .widget-card {
            background: linear-gradient(180deg, rgba(30, 31, 45, 0.7) 0%, rgba(20, 21, 30, 0.8) 100%);
            border: 1px solid rgba(124, 140, 245, 0.15);
            border-radius: 20px;
            padding: 24px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 
                0 4px 24px -8px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.3s;
        }

        .widget-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(800px circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(124, 140, 245, 0.08), transparent 40%);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s;
            z-index: 1;
        }

        .widget-card:hover::before {
            opacity: 1;
        }

        .widget-card:hover {
            transform: translateY(-4px);
            box-shadow: 
                0 12px 32px -8px rgba(0, 0, 0, 0.6),
                0 0 20px rgba(124, 140, 245, 0.15),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            border-color: rgba(124, 140, 245, 0.4);
        }

        .widget-card.full-width {
            grid-column: 1 / -1;
        }

        .widget-label {
            font-size: 0.9rem;
            font-weight: 700;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 20px;
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .widget-label::before {
            content: '';
            display: block;
            width: 4px;
            height: 16px;
            background: var(--color-primary);
            border-radius: 4px;
            box-shadow: 0 0 10px var(--color-primary);
        }

        .widget-inner {
            flex: 1;
            min-height: 0;
            z-index: 2;
            border-radius: 12px;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.03);
            position: relative;
        }

        .empty-state {
            text-align: center;
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 1.1rem;
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
            padding: 80px 20px;
        }

        .empty-state svg {
            width: 48px;
            height: 48px;
            opacity: 0.5;
        }

        /* Ticker Banner (shown after search) */
        .ticker-banner {
            background: linear-gradient(135deg, rgba(124, 140, 245, 0.08) 0%, rgba(124, 140, 245, 0.02) 100%);
            border: 1px solid rgba(124, 140, 245, 0.15);
            border-radius: 12px;
            padding: 16px 24px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .ticker-banner-symbol {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--color-primary);
        }

        .ticker-banner-desc {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        /* ─── Insider Trading Table ─── */
        .insider-table-wrap {
            overflow-x: auto;
            overflow-y: auto;
            max-height: 420px;
            z-index: 2;
            position: relative;
        }

        .insider-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
            white-space: nowrap;
        }

        .insider-table thead th {
            background: rgba(124, 140, 245, 0.12);
            color: #b0b8d1;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 10px 12px;
            border-bottom: 1px solid rgba(124, 140, 245, 0.15);
            text-align: left;
            position: sticky;
            top: 0;
        }

        .insider-table tbody td {
            padding: 8px 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            color: var(--text-primary);
        }

        .insider-table tbody tr:hover {
            background: rgba(124, 140, 245, 0.06);
        }

        .insider-buy {
            color: #22c55e !important;
            font-weight: 600;
        }

        .insider-sell {
            color: #ef4444 !important;
            font-weight: 600;
        }

        .insider-loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .insider-error {
            text-align: center;
            padding: 40px;
            color: #f59e0b;
            font-size: 0.9rem;
        }

        .insider-link {
            display: inline-block;
            margin-top: 12px;
            color: var(--color-primary);
            text-decoration: none;
            font-size: 0.85rem;
            opacity: 0.8;
            transition: opacity 0.2s;
        }

        .insider-link:hover {
            opacity: 1;
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>

    <main class="container">
        <header class="dashboard-header">
            <div class="header-main">
                <h1 class="dashboard-title">Earnings Analysis</h1>
                <div class="nav-tabs">
                    <a href="./index.html" class="nav-tab">1. Dashboard</a>
                    <a href="./screener.html" class="nav-tab">2. Screener</a>
                    <a href="./insight.html" class="nav-tab">3. Insight</a>
                    <a href="./earnings.html" class="nav-tab active">4. Earnings</a>
                </div>
            </div>
            <p class="dashboard-subtitle">종목 검색 및 기업 실적 확인 (On-Demand) &nbsp;|&nbsp; <span id="update-date">기준일: -</span></p>
        </header>

        <div class="search-container">
            <input type="text" id="ticker-input" class="search-input" placeholder="종목 티커를 입력하세요 (예: AAPL, TSLA, NVDA)" autocomplete="off" spellcheck="false">
            <button id="search-btn" class="search-button">검색</button>
        </div>

        <!-- Ticker Banner (shown after search) -->
        <div id="ticker-banner" class="ticker-banner" style="display: none;">
            <span class="ticker-banner-symbol" id="banner-symbol"></span>
        </div>

        <!-- Empty state (shown before search) -->
        <div id="empty-state" class="empty-state">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            <span>티커를 검색하시면 여기에 주요 재무/실적 데이터가 표시됩니다.</span>
        </div>

        <!-- Widgets Grid (hidden until search) -->
        <div class="widgets-grid" id="widgets-container" style="display: none;">


            <!-- 4. EPS Estimates Revision -->
            <div class="widget-card full-width" id="widget-eps-revision">
                <div class="widget-label">📊 EPS 추정치 변화 (EPS Estimates Revision)</div>
                <div class="widget-inner" id="eps-revision-inner">
                    <div class="insider-loading">종목을 검색하면 EPS 추정치 데이터가 표시됩니다.</div>
                </div>
            </div>



            <!-- 3. Insider Trading (OpenInsider) -->
            <div class="widget-card full-width" id="widget-insider">
                <div class="widget-label">🔍 내부자 거래 (Insider Trading - SEC Form 4)</div>
                <div class="widget-inner" id="insider-inner">
                    <div class="insider-loading">종목을 검색하면 내부자 거래 내역이 표시됩니다.</div>
                </div>
            </div>

        </div>
    </main>

    <script src="./data/index_constituents.js"></script>
    <script src="./data/eps_trend.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        // Mouse glow effect for widget cards
        document.addEventListener('mousemove', e => {
            document.querySelectorAll('.widget-card').forEach(card => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                card.style.setProperty('--mouse-x', `${x}px`);
                card.style.setProperty('--mouse-y', `${y}px`);
            });
        });

        let allStocks = [];
        if (typeof window.screenerData !== 'undefined' && window.screenerData.stocks) {
            allStocks = window.screenerData.stocks;
        }

        function getTvSymbol(ticker) {
            const stock = allStocks.find(s => s.ticker === ticker);
            if (!stock) {
                if (ticker.endsWith('.KS') || ticker.endsWith('.KQ')) return 'KRX:' + ticker.split('.')[0];
                return ticker;
            }

            if (stock.exchange) {
                const ex = stock.exchange.toUpperCase();
                if (ex.includes('NMS') || ex.includes('NGM') || ex.includes('NCM') || ex.includes('NASDAQ')) return 'NASDAQ:' + ticker;
                if (ex.includes('NYQ') || ex.includes('NYS') || ex.includes('NYSE')) return 'NYSE:' + ticker;
                if (ex.includes('PNK') || ex.includes('OTC')) return 'OTC:' + ticker;
                if (ex === 'BTS' || ex === 'BATS') return 'BATS:' + ticker;
            }
            if (stock.nasdaq100) return 'NASDAQ:' + ticker;
            return 'NYSE:' + ticker;
        }

        // Helper: create and inject a TradingView widget script
        function injectWidget(containerId, scriptUrl, config) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            const wrapper = document.createElement('div');
            wrapper.className = 'tradingview-widget-container';
            const widgetDiv = document.createElement('div');
            widgetDiv.className = 'tradingview-widget-container__widget';
            wrapper.appendChild(widgetDiv);
            const script = document.createElement('script');
            script.src = scriptUrl;
            script.type = 'text/javascript';
            script.async = true;
            script.innerHTML = JSON.stringify(config);
            wrapper.appendChild(script);
            container.appendChild(wrapper);
        }

        document.getElementById('ticker-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') loadWidgets();
        });

        document.getElementById('search-btn').addEventListener('click', loadWidgets);

        function loadWidgets() {
            const rawTicker = document.getElementById('ticker-input').value.trim().toUpperCase();
            if (!rawTicker) return;

            const tvSymbol = getTvSymbol(rawTicker);
            const spreadSymbol = tvSymbol + "/AMEX:SPY";

            // Show widgets grid, hide empty state
            document.getElementById('empty-state').style.display = 'none';
            document.getElementById('widgets-container').style.display = 'grid';

            // Update banner
            const banner = document.getElementById('ticker-banner');
            banner.style.display = 'flex';
            document.getElementById('banner-symbol').textContent = tvSymbol;


            // ─── 3. Insider Trading (OpenInsider) ───
            loadInsiderTrading(rawTicker);

            // ─── 4. EPS Estimates Revision ───
            loadEpsRevision(rawTicker);
        }

        async function loadInsiderTrading(ticker) {
            const container = document.getElementById('insider-inner');
            container.innerHTML = '<div class="insider-loading">⏳ 내부자 거래 내역을 불러오는 중...</div>';

            const openInsiderUrl = `http://openinsider.com/screener?s=${ticker}&o=&pl=&ph=&st=0&fdlb=&fdle=&td=0&tdr=&fdRangeStarts=&fdRangeEnde=&dtefRangeStarts=&dtefRangeEnde=&janession=0&vession=0&cession=0&sortcol=0&cnt=30&page=1`;

            // Try multiple CORS proxies
            const proxies = [
                url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
                url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
                url => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`
            ];

            let html = null;
            for (const proxy of proxies) {
                try {
                    const resp = await fetch(proxy(openInsiderUrl), { signal: AbortSignal.timeout(12000) });
                    if (resp.ok) {
                        html = await resp.text();
                        break;
                    }
                } catch (e) {
                    continue;
                }
            }

            if (!html) {
                container.innerHTML = `<div class="insider-error">⚠️ 데이터를 불러올 수 없습니다. <a href="http://openinsider.com/screener?s=${ticker}" target="_blank" class="insider-link">OpenInsider에서 직접 확인 →</a></div>`;
                return;
            }

            // Parse the HTML table
            const parser = new DOMParser();
            const doc = parser.parseFromString(html, 'text/html');
            const table = doc.querySelector('table.tinytable');

            if (!table) {
                container.innerHTML = `<div class="insider-error">⚠️ 내부자 거래 데이터가 없습니다. <a href="http://openinsider.com/screener?s=${ticker}" target="_blank" class="insider-link">OpenInsider에서 직접 확인 →</a></div>`;
                return;
            }

            const rows = table.querySelectorAll('tr');
            if (rows.length < 2) {
                container.innerHTML = '<div class="insider-error">내부자 거래 내역이 없습니다.</div>';
                return;
            }

            // Build our styled table
            let tableHtml = `<div class="insider-table-wrap"><table class="insider-table">`;
            tableHtml += `<thead><tr>
                <th>Filing Date</th>
                <th>Trade Date</th>
                <th>Insider Name</th>
                <th>Title</th>
                <th>Type</th>
                <th>Price</th>
                <th>Qty</th>
                <th>Owned</th>
                <th>ΔOwn</th>
                <th>Value</th>
            </tr></thead><tbody>`;

            for (let i = 1; i < rows.length; i++) {
                const cells = rows[i].querySelectorAll('td');
                if (cells.length < 12) continue;

                const filingDate = cells[1]?.textContent?.trim() || '';
                const tradeDate = cells[2]?.textContent?.trim() || '';
                const insiderName = cells[4]?.textContent?.trim() || '';
                const title = cells[5]?.textContent?.trim() || '';
                const tradeType = cells[6]?.textContent?.trim() || '';
                const price = cells[7]?.textContent?.trim() || '';
                const qty = cells[8]?.textContent?.trim() || '';
                const owned = cells[9]?.textContent?.trim() || '';
                const deltaOwn = cells[10]?.textContent?.trim() || '';
                const value = cells[11]?.textContent?.trim() || '';

                const isBuy = tradeType.includes('P') || tradeType.toLowerCase().includes('purchase');
                const isSell = tradeType.includes('S') || tradeType.toLowerCase().includes('sale');
                const typeClass = isBuy ? 'insider-buy' : (isSell ? 'insider-sell' : '');

                tableHtml += `<tr>
                    <td>${filingDate.split(' ')[0] || filingDate}</td>
                    <td>${tradeDate.split(' ')[0] || tradeDate}</td>
                    <td>${insiderName}</td>
                    <td>${title}</td>
                    <td class="${typeClass}">${tradeType}</td>
                    <td>${price}</td>
                    <td class="${typeClass}">${qty}</td>
                    <td>${owned}</td>
                    <td>${deltaOwn}</td>
                    <td class="${typeClass}">${value}</td>
                </tr>`;
            }

            tableHtml += `</tbody></table></div>`;
            tableHtml += `<a href="http://openinsider.com/screener?s=${ticker}" target="_blank" class="insider-link">📎 OpenInsider에서 전체 내역 보기 →</a>`;

            container.innerHTML = tableHtml;
        }

        function loadEpsRevision(ticker) {
            const container = document.getElementById('eps-revision-inner');
            
            const noDataHtml = `
                <div style="text-align: center; color: #a0aabc; padding: 60px 20px; background: rgba(0,0,0,0.15); border-radius: 8px; border: 1px dashed rgba(255,255,255,0.1);">
                    <div style="font-size: 2.5rem; margin-bottom: 15px; opacity: 0.8;">📡</div>
                    <div style="font-size: 1.1rem; font-weight: 500; color: #e0e0e0; margin-bottom: 8px; letter-spacing: -0.5px;">데이터가 제공되지 않는 종목입니다</div>
                    <div style="font-size: 0.9rem; line-height: 1.5;">(주로 Class B 주식 등에서 발생)</div>
                </div>
            `;

            if (!window.eps_trend_data || !window.eps_trend_data[ticker]) {
                container.innerHTML = noDataHtml;
                return;
            }

            const data = window.eps_trend_data[ticker];
            const data0q = data['0q'];
            const data1q = data['+1q'];
            const data0y = data['0y'];
            const data1y = data['+1y'];

            if (!data0q && !data1q && !data0y && !data1y) {
                container.innerHTML = noDataHtml;
                return;
            }

            let html = '<div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; width: 100%;">';
            
            const createChartDiv = (title, id) => {
                return '<div style="position: relative; background: rgba(0,0,0,0.1); border-radius: 8px; padding: 15px;">' +
                       '<h3 style="text-align: center; color: #e0e0e0; font-size: 1rem; margin-bottom: 10px; font-weight: 500;">' + title + '</h3>' +
                       '<div style="position: relative; height: 280px; width: 100%;"><canvas id="' + id + '"></canvas></div></div>';
            };

            if (data0q) html += createChartDiv('Current Quarter', 'epsChart0q');
            if (data1q) html += createChartDiv('Next Quarter', 'epsChart1q');
            if (data0y) html += createChartDiv('Current Year', 'epsChart0y');
            if (data1y) html += createChartDiv('Next Year', 'epsChart1y');
            
            html += '</div><div style="text-align: right; margin-top: 10px; font-size: 0.8rem; color: #a0aabc;"><a href="https://finance.yahoo.com/quote/' + ticker + '/analysis/" target="_blank" style="color: #a0aabc; text-decoration: underline;">출처: Yahoo Finance Analysis</a></div>';
            container.innerHTML = html;

            const labels = ['90 Days Ago', '60 Days Ago', '30 Days Ago', '7 Days Ago', 'Current'];
            
            const commonOptions = {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        callbacks: {
                            label: function(context) { return Number(context.parsed.y).toFixed(2) + ' USD'; }
                        }
                    }
                },
                scales: {
                    x: { grid: { color: 'rgba(255, 255, 255, 0.05)' }, ticks: { color: '#e0e0e0', font: { family: "'Pretendard', sans-serif" } } },
                    y: { grid: { color: 'rgba(255, 255, 255, 0.1)' }, ticks: { color: '#e0e0e0', font: { family: "'Pretendard', sans-serif" }, callback: function(value) { return Number(value).toFixed(2) + ' USD'; } } }
                }
            };

            const renderChart = (id, label, chartData, color) => {
                if (!chartData) return;
                const ctx = document.getElementById(id).getContext('2d');
                new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: label,
                            data: chartData,
                            borderColor: color,
                            backgroundColor: color.replace('1)', '0.1)'),
                            stepped: true,
                            fill: true,
                            pointBackgroundColor: color,
                            pointRadius: 5
                        }]
                    },
                    options: commonOptions
                });
            };

            renderChart('epsChart0q', 'Current Quarter', data0q, 'rgba(54, 162, 235, 1)');
            renderChart('epsChart1q', 'Next Quarter', data1q, 'rgba(255, 159, 64, 1)');
            renderChart('epsChart0y', 'Current Year', data0y, 'rgba(75, 192, 192, 1)');
            renderChart('epsChart1y', 'Next Year', data1y, 'rgba(255, 99, 132, 1)');
        }


    </script>
    <script src="./data.js"></script>
    <script>
        // Update date logic
        if (window.fng_data) {
            const dates = Object.keys(window.fng_data).sort().reverse();
            if (dates.length > 0) {
                const latestDate = dates[0];
                const latestData = window.fng_data[latestDate];
                document.getElementById('update-date').innerText = `기준일: ${latestDate} (US)${latestData.updated_at ? ' | 업데이트: ' + latestData.updated_at : ''}`;
            }
        }
    </script>
</body>
