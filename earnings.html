<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실적 및 재무 정보 | Jypark13 Dashboard</title>
    <meta name="description" content="종목 티커를 입력하여 실시간 실적(Earnings) 및 재무 정보를 쉽게 확인하세요.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at 50% 50%, #1a1b26 0%, #0f1017 100%);
            --card-bg: rgba(26, 27, 38, 0.6);
            --card-border: rgba(130, 140, 180, 0.1);
            --text-primary: #e1e4ed;
            --text-secondary: #8b92a8;
            --accent-glow: 0 15px 35px -10px rgba(130, 140, 200, 0.08);
            --font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --color-primary: #7c8cf5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            background: var(--bg-gradient);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 40px 20px;
            line-height: 1.6;
            position: relative;
            overflow-x: hidden;
        }

        .bg-glow-1 {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(100, 110, 180, 0.06) 0%, rgba(100, 110, 180, 0) 70%);
            top: -10%;
            left: -10%;
            z-index: 0;
            pointer-events: none;
        }

        .bg-glow-2 {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(90, 100, 170, 0.05) 0%, rgba(90, 100, 170, 0) 70%);
            bottom: -10%;
            right: -10%;
            z-index: 0;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 1120px;
            margin: 0 auto;
            z-index: 1;
            position: relative;
        }

        .dashboard-header {
            margin-bottom: 30px;
        }

        .header-main {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            gap: 20px;
            flex-wrap: wrap;
        }

        h1.dashboard-title {
            font-size: 2.25rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 0%, #7c8cf5 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.025em;
            margin-bottom: 0;
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
            background: rgba(0, 0, 0, 0.2);
            padding: 6px;
            border-radius: 12px;
            border: 1px solid var(--card-border);
        }

        .nav-tab {
            padding: 8px 16px;
            border-radius: 8px;
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s;
        }

        .nav-tab:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.05);
        }

        .nav-tab.active {
            background: rgba(124, 140, 245, 0.15);
            color: #7c8cf5;
            box-shadow: inset 0 0 0 1px rgba(124, 140, 245, 0.3);
        }

        .dashboard-subtitle {
            color: var(--text-secondary);
            font-size: 1rem;
            font-weight: 400;
        }

        .search-container {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: var(--accent-glow);
        }

        .search-input {
            flex-grow: 1;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 16px 20px;
            color: var(--text-primary);
            font-family: var(--font-family);
            font-size: 1.1rem;
            font-weight: 500;
            outline: none;
            transition: all 0.3s;
        }

        .search-input:focus {
            border-color: var(--color-primary);
            background: rgba(0, 0, 0, 0.4);
            box-shadow: 0 0 0 2px rgba(124, 140, 245, 0.2);
        }

        .search-input::placeholder {
            color: var(--text-secondary);
        }

        .search-button {
            background: var(--color-primary);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 16px 32px;
            font-family: var(--font-family);
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .search-button:hover {
            background: #6b7aec;
            transform: translateY(-1px);
        }

        .widgets-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
            margin-top: 24px;
        }

        @media (min-width: 900px) {
            .widgets-grid {
                grid-template-columns: 1fr 1fr;
            }
            .widget-financials {
                grid-column: span 2;
            }
        }

        .widget-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 16px;
            backdrop-filter: blur(10px);
            box-shadow: var(--accent-glow);
            overflow: hidden;
            min-height: 500px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .empty-state {
            text-align: center;
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 1.1rem;
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
        }

        .empty-state svg {
            width: 48px;
            height: 48px;
            opacity: 0.5;
        }

    </style>
</head>

<body>
    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>

    <main class="container">
        <header class="dashboard-header">
            <div class="header-main">
                <h1 class="dashboard-title">Jypark13 Investment Dashboard</h1>
                <div class="nav-tabs">
                    <a href="./index.html" class="nav-tab">1. Dashboard</a>
                    <a href="./screener.html" class="nav-tab">2. Screener</a>
                    <a href="./insight.html" class="nav-tab">3. Insight</a>
                    <a href="./earnings.html" class="nav-tab active">4. Earnings(작업 중)</a>
                </div>
            </div>
            <p class="dashboard-subtitle">종목 검색 및 기업 실적 확인 (On-Demand)</p>
        </header>

        <div class="search-container">
            <input type="text" id="ticker-input" class="search-input" placeholder="종목 티커를 입력하세요 (예: AAPL, TSLA, NVDA)" autocomplete="off" spellcheck="false">
            <button id="search-btn" class="search-button">검색</button>
        </div>

        <div class="widgets-grid" id="widgets-container">
            <div class="widget-card widget-financials" style="grid-column: span 2;">
                <div class="empty-state">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    <span>티커를 검색하시면 여기에 주요 재무/실적 데이터가 표시됩니다.</span>
                </div>
            </div>
        </div>
    </main>

    <script src="./data/index_constituents.js"></script>
    <script>
        let allStocks = [];
        if (typeof window.fng_data !== 'undefined' && window.fng_data.stocks) {
            allStocks = window.fng_data.stocks;
        }

        function getTvSymbol(ticker) {
            const stock = allStocks.find(s => s.ticker === ticker);
            if (!stock) {
                // Default guess if not in our DB
                if (ticker.endsWith('.KS') || ticker.endsWith('.KQ')) return 'KRX:' + ticker.split('.')[0];
                return ticker; // let TV try to guess
            }
            
            if (stock.exchange) {
                const ex = stock.exchange.toUpperCase();
                if (ex.includes('NMS') || ex.includes('NGM') || ex.includes('NCM') || ex.includes('NASDAQ')) return 'NASDAQ:' + ticker;
                if (ex.includes('NYQ') || ex.includes('NYS') || ex.includes('NYSE')) return 'NYSE:' + ticker;
                if (ex.includes('PNK') || ex.includes('OTC')) return 'OTC:' + ticker;
                if (ex === 'BTS' || ex === 'BATS') return 'BATS:' + ticker;
            }
            if (stock.nasdaq100) return 'NASDAQ:' + ticker;
            return 'NYSE:' + ticker;
        }

        document.getElementById('ticker-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                loadWidgets();
            }
        });

        document.getElementById('search-btn').addEventListener('click', loadWidgets);

        function loadWidgets() {
            const rawTicker = document.getElementById('ticker-input').value.trim().toUpperCase();
            if (!rawTicker) return;

            // Get the proper symbol with exchange prefix
            let tvSymbol = getTvSymbol(rawTicker);
            let spreadSymbol = tvSymbol + "/AMEX:SPY"; // Relative to SPY (S&P 500 ETF) for perfect ratio tracking

            const container = document.getElementById('widgets-container');
            
            // Clear current widgets
            container.innerHTML = `
                <div class="widget-card widget-financials" id="financials-widget" style="grid-column: span 2;"></div>
                <div class="widget-card" id="chart-widget" style="grid-column: span 2;"></div>
            `;

            // 1. Financials Widget
            const finContainer = document.getElementById('financials-widget');
            const finScript = document.createElement('script');
            finScript.src = "https://s3.tradingview.com/external-embedding/embed-widget-financials.js";
            finScript.type = "text/javascript";
            finScript.async = true;
            finScript.innerHTML = JSON.stringify({
                "isTransparent": true,
                "largeChartUrl": "",
                "displayMode": "regular",
                "width": "100%",
                "height": "700",
                "colorTheme": "dark",
                "symbol": tvSymbol,
                "locale": "kr"
            });
            finContainer.appendChild(finScript);

            // 2. Technical Chart Widget (Relative to SPX)
            const chartContainer = document.getElementById('chart-widget');
            const chartScript = document.createElement('script');
            chartScript.src = "https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js";
            chartScript.type = "text/javascript";
            chartScript.async = true;
            chartScript.innerHTML = JSON.stringify({
                "width": "100%",
                "height": "600",
                "symbol": spreadSymbol,
                "interval": "D",
                "timezone": "Asia/Seoul",
                "theme": "dark",
                "style": "2", // 2 = Line chart, good for relative performance
                "locale": "kr",
                "enable_publishing": false,
                "hide_top_toolbar": false,
                "hide_legend": false,
                "save_image": false,
                "isTransparent": true
            });
            chartContainer.appendChild(chartScript);
        }
    </script>
</body>

</html>
