<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실적 및 재무 정보 | Jypark13 Dashboard</title>
    <meta name="description" content="종목 티커를 입력하여 실시간 실적(Earnings) 및 재무 정보를 쉽게 확인하세요.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at 50% 50%, #1a1b26 0%, #0f1017 100%);
            --card-bg: rgba(26, 27, 38, 0.6);
            --card-border: rgba(130, 140, 180, 0.1);
            --text-primary: #e1e4ed;
            --text-secondary: #8b92a8;
            --accent-glow: 0 15px 35px -10px rgba(130, 140, 200, 0.08);
            --font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --color-primary: #7c8cf5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            background: var(--bg-gradient);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 40px 20px;
            line-height: 1.6;
            position: relative;
            overflow-x: hidden;
        }

        .bg-glow-1 {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(100, 110, 180, 0.06) 0%, rgba(100, 110, 180, 0) 70%);
            top: -10%;
            left: -10%;
            z-index: 0;
            pointer-events: none;
        }

        .bg-glow-2 {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(90, 100, 170, 0.05) 0%, rgba(90, 100, 170, 0) 70%);
            bottom: -10%;
            right: -10%;
            z-index: 0;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 1120px;
            margin: 0 auto;
            z-index: 1;
            position: relative;
        }

        .dashboard-header {
            margin-bottom: 30px;
        }

        .header-main {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            gap: 20px;
            flex-wrap: wrap;
        }

        h1.dashboard-title {
            font-size: 2.25rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 0%, #7c8cf5 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.025em;
            margin-bottom: 0;
        }

        .nav-tabs {
            display: flex;
            gap: 4px;
            background: rgba(26, 27, 38, 0.5);
            padding: 4px;
            border-radius: 12px;
            border: 1px solid rgba(130, 140, 180, 0.1);
        }

        .nav-tab {
            padding: 8px 20px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .nav-tab:hover {
            color: var(--text-primary);
            background: rgba(124, 140, 245, 0.08);
        }

        .nav-tab.active {
            color: #7c8cf5;
            background: rgba(124, 140, 245, 0.15);
            font-weight: 600;
        }

        .dashboard-subtitle {
            font-size: 0.95rem;
            color: var(--text-secondary);
            font-weight: 400;
        }

        .search-container {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: var(--accent-glow);
        }

        .search-input {
            flex-grow: 1;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 16px 20px;
            color: var(--text-primary);
            font-family: var(--font-family);
            font-size: 1.1rem;
            font-weight: 500;
            outline: none;
            transition: all 0.3s;
        }

        .search-input:focus {
            border-color: var(--color-primary);
            background: rgba(0, 0, 0, 0.4);
            box-shadow: 0 0 0 2px rgba(124, 140, 245, 0.2);
        }

        .search-input::placeholder {
            color: var(--text-secondary);
        }

        .search-button {
            background: var(--color-primary);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 16px 32px;
            font-family: var(--font-family);
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .search-button:hover {
            background: #6b7aec;
            transform: translateY(-1px);
        }

        /* ─── Widget Layout ─── */
        .widgets-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-top: 24px;
        }

        @media (min-width: 900px) {
            .widgets-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .widget-card {
            background: linear-gradient(180deg, rgba(30, 31, 45, 0.7) 0%, rgba(20, 21, 30, 0.8) 100%);
            border: 1px solid rgba(124, 140, 245, 0.15);
            border-radius: 20px;
            padding: 24px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 
                0 4px 24px -8px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.3s;
        }

        .widget-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(800px circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(124, 140, 245, 0.08), transparent 40%);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s;
            z-index: 1;
        }

        .widget-card:hover::before {
            opacity: 1;
        }

        .widget-card:hover {
            transform: translateY(-4px);
            box-shadow: 
                0 12px 32px -8px rgba(0, 0, 0, 0.6),
                0 0 20px rgba(124, 140, 245, 0.15),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            border-color: rgba(124, 140, 245, 0.4);
        }

        .widget-card.full-width {
            grid-column: 1 / -1;
        }

        .widget-label {
            font-size: 0.9rem;
            font-weight: 700;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 20px;
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .widget-label::before {
            content: '';
            display: block;
            width: 4px;
            height: 16px;
            background: var(--color-primary);
            border-radius: 4px;
            box-shadow: 0 0 10px var(--color-primary);
        }

        .widget-inner {
            flex: 1;
            min-height: 0;
            z-index: 2;
            border-radius: 12px;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.03);
            position: relative;
        }

        .empty-state {
            text-align: center;
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 1.1rem;
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
            padding: 80px 20px;
        }

        .empty-state svg {
            width: 48px;
            height: 48px;
            opacity: 0.5;
        }

        /* Ticker Banner (shown after search) */
        .ticker-banner {
            background: linear-gradient(135deg, rgba(124, 140, 245, 0.08) 0%, rgba(124, 140, 245, 0.02) 100%);
            border: 1px solid rgba(124, 140, 245, 0.15);
            border-radius: 12px;
            padding: 16px 24px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .ticker-banner-symbol {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--color-primary);
        }

        .ticker-banner-desc {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }
    </style>
</head>

<body>
    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>

    <main class="container">
        <header class="dashboard-header">
            <div class="header-main">
                <h1 class="dashboard-title">Earnings Analysis</h1>
                <div class="nav-tabs">
                    <a href="./index.html" class="nav-tab">1. Dashboard</a>
                    <a href="./screener.html" class="nav-tab">2. Screener</a>
                    <a href="./insight.html" class="nav-tab">3. Insight</a>
                    <a href="./earnings.html" class="nav-tab active">4. Earnings</a>
                </div>
            </div>
            <p class="dashboard-subtitle">종목 검색 및 기업 실적 확인 (On-Demand) &nbsp;|&nbsp; <span id="update-date">기준일: -</span></p>
        </header>

        <div class="search-container">
            <input type="text" id="ticker-input" class="search-input" placeholder="종목 티커를 입력하세요 (예: AAPL, TSLA, NVDA)" autocomplete="off" spellcheck="false">
            <button id="search-btn" class="search-button">검색</button>
        </div>

        <!-- Ticker Banner (shown after search) -->
        <div id="ticker-banner" class="ticker-banner" style="display: none;">
            <span class="ticker-banner-symbol" id="banner-symbol"></span>
            <span class="ticker-banner-desc">TradingView에서 제공하는 실시간 데이터를 표시합니다. 아래에서 각 위젯을 확인하세요.</span>
        </div>

        <!-- Empty state (shown before search) -->
        <div id="empty-state" class="empty-state">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            <span>티커를 검색하시면 여기에 주요 재무/실적 데이터가 표시됩니다.</span>
        </div>

        <!-- Widgets Grid (hidden until search) -->
        <div class="widgets-grid" id="widgets-container" style="display: none;">

            <!-- 1. Financials (income statement, balance sheet, etc.) -->
            <div class="widget-card full-width" id="widget-financials">
                <div class="widget-label">💰 재무제표 (Financials)</div>
                <div class="widget-inner" id="financials-inner"></div>
            </div>

            <!-- 2. Advanced Chart (relative to SPX) -->
            <div class="widget-card full-width" id="widget-chart-rel">
                <div class="widget-label">📉 SPX 대비 상대강도 차트 (Relative to SPX)</div>
                <div class="widget-inner" id="chart-rel-inner"></div>
            </div>

        </div>
    </main>

    <script src="./data/index_constituents.js"></script>
    <script>
        // Mouse glow effect for widget cards
        document.addEventListener('mousemove', e => {
            document.querySelectorAll('.widget-card').forEach(card => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                card.style.setProperty('--mouse-x', `${x}px`);
                card.style.setProperty('--mouse-y', `${y}px`);
            });
        });

        let allStocks = [];
        if (typeof window.screenerData !== 'undefined' && window.screenerData.stocks) {
            allStocks = window.screenerData.stocks;
        }

        function getTvSymbol(ticker) {
            const stock = allStocks.find(s => s.ticker === ticker);
            if (!stock) {
                if (ticker.endsWith('.KS') || ticker.endsWith('.KQ')) return 'KRX:' + ticker.split('.')[0];
                return ticker;
            }

            if (stock.exchange) {
                const ex = stock.exchange.toUpperCase();
                if (ex.includes('NMS') || ex.includes('NGM') || ex.includes('NCM') || ex.includes('NASDAQ')) return 'NASDAQ:' + ticker;
                if (ex.includes('NYQ') || ex.includes('NYS') || ex.includes('NYSE')) return 'NYSE:' + ticker;
                if (ex.includes('PNK') || ex.includes('OTC')) return 'OTC:' + ticker;
                if (ex === 'BTS' || ex === 'BATS') return 'BATS:' + ticker;
            }
            if (stock.nasdaq100) return 'NASDAQ:' + ticker;
            return 'NYSE:' + ticker;
        }

        // Helper: create and inject a TradingView widget script
        function injectWidget(containerId, scriptUrl, config) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            const wrapper = document.createElement('div');
            wrapper.className = 'tradingview-widget-container';
            const widgetDiv = document.createElement('div');
            widgetDiv.className = 'tradingview-widget-container__widget';
            wrapper.appendChild(widgetDiv);
            const script = document.createElement('script');
            script.src = scriptUrl;
            script.type = 'text/javascript';
            script.async = true;
            script.innerHTML = JSON.stringify(config);
            wrapper.appendChild(script);
            container.appendChild(wrapper);
        }

        document.getElementById('ticker-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') loadWidgets();
        });

        document.getElementById('search-btn').addEventListener('click', loadWidgets);

        function loadWidgets() {
            const rawTicker = document.getElementById('ticker-input').value.trim().toUpperCase();
            if (!rawTicker) return;

            const tvSymbol = getTvSymbol(rawTicker);
            const spreadSymbol = tvSymbol + "/SP:SPX";

            // Show widgets grid, hide empty state
            document.getElementById('empty-state').style.display = 'none';
            document.getElementById('widgets-container').style.display = 'grid';

            // Update banner
            const banner = document.getElementById('ticker-banner');
            banner.style.display = 'flex';
            document.getElementById('banner-symbol').textContent = tvSymbol;

            // ─── 1. Financials ───
            injectWidget('financials-inner',
                'https://s3.tradingview.com/external-embedding/embed-widget-financials.js',
                {
                    "isTransparent": true,
                    "largeChartUrl": "",
                    "displayMode": "regular",
                    "width": "100%",
                    "height": 700,
                    "colorTheme": "dark",
                    "symbol": tvSymbol,
                    "locale": "kr"
                }
            );

            // ─── 2. Advanced Chart (relative to SPY) ───
            injectWidget('chart-rel-inner',
                'https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js',
                {
                    "width": "100%",
                    "height": 550,
                    "symbol": spreadSymbol,
                    "interval": "D",
                    "timezone": "America/New_York",
                    "theme": "dark",
                    "style": "2",
                    "locale": "kr",
                    "enable_publishing": false,
                    "hide_top_toolbar": false,
                    "hide_legend": false,
                    "save_image": false,
                    "isTransparent": true
                }
            );
        }
    </script>
    <script src="./data.js"></script>
    <script>
        // Update date logic
        if (window.fng_data) {
            const dates = Object.keys(window.fng_data).sort().reverse();
            if (dates.length > 0) {
                const latestDate = dates[0];
                const latestData = window.fng_data[latestDate];
                document.getElementById('update-date').innerText = `기준일: ${latestDate} (US)${latestData.updated_at ? ' | 업데이트: ' + latestData.updated_at : ''}`;
            }
        }
    </script>
</body>

</html>
